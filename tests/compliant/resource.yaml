---
# One workload that satisfies every validating rule in this library at once.
#
# The per-set test cases check each rule in both directions. They cannot see whether the
# rules are collectively satisfiable: a set of individually reasonable policies can still
# leave nothing admissible — a registry rule and a signing rule naming different hosts,
# or a spread rule that contradicts a placement rule. The pipeline applies every
# validating policy to this manifest with audit findings treated as failures, so anything
# reported here is a false positive in the library rather than a problem with the
# workload.
apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod
  namespace: apps
  labels:
    app.kubernetes.io/name: api
    network.example.com/tier: frontend
spec:
  containers:
    - name: api
      image: registry.example.com/team/api:1.4.2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true

---
# The same workload as a controller, so the rules Kyverno generates are exercised against
# a real Deployment rather than only against a Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliant-deployment
  namespace: apps
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        network.example.com/tier: frontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      containers:
        - name: api
          image: registry.example.com/team/api:1.4.2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

---
# A budget that permits one eviction and names the pods it covers.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: compliant-budget
  namespace: apps
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api

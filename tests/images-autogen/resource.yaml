---
# Controllers, not Pods. Every rule in this library matches `Pod` and nothing else, which
# is what leaves Kyverno's auto-generation switched on — naming a controller kind in a
# match block turns it off and narrows the rule to exactly the kinds listed. That
# behaviour is the single most load-bearing convention here and is asserted nowhere else,
# so these fixtures are Deployments and the expectations name the original rule names.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-pinned
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-pinned
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-pinned
    spec:
      containers:
        - name: api
          image: registry.example.com/team/api:1.4.2

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-latest
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-latest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-latest
    spec:
      containers:
        - name: api
          image: registry.example.com/team/api:latest
